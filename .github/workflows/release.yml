# Release: tag vX.Y.Z -> Windows and macOS builds + tests -> one GitHub Release with both, so the two platforms
# always ship the same version (the release job needs both builds):
#   Windows: keysynth-setup.exe (stable name for the direct "latest/download" link) + keysynth-setup-X.Y.Z.exe
#   macOS:   keysynth-macos.dmg (stable name) + keysynth-macos-X.Y.Z.dmg
# Manual dispatch builds both as workflow artifacts only (no release).
# Local equivalent and details: docs/TESTING.md "Release / installer" and "macOS release", ARCHITECTURE §16.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z (default: project() version in CMakeLists.txt)'
        required: false
        default: ''

# Build job (runs npm ci lifecycle scripts, third-party build steps) is read-only; only `release` can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag must be vX.Y.Z (got $env:GITHUB_REF_NAME)" }
            $v = $Matches[1]
          } elseif ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION
          } else {
            $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(keysynth VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "bad version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "keysynth $v"

      - name: Toolchain info
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
          cmake --version
          node --version

      - name: Cache dependency sources (.deps)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache Faust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/faust
          key: faust-${{ runner.os }}-${{ hashFiles('scripts/fetch_faust.ps1') }}

      - name: Fetch Faust
        run: scripts/fetch_faust.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configure (sfizz ON, Faust ON)
        run: scripts/configure.ps1 -BuildDir build -Generator auto -ExtraArgs '-DKS_VERSION=${{ steps.ver.outputs.version }}','-DKS_WITH_SFIZZ=ON','-DKS_WITH_FAUST=ON'

      - name: Build (Release)
        run: cmake --build build --config Release --target keysynth-app ks-tests --parallel

      - name: Tests (default tier; hidden [.samples] / [.cloud-live] / [.full] are not run)
        run: |
          build/bin/Release/ks-tests.exe --reporter compact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --version=6.7.3 -y --no-progress
          }

      - name: Installer
        run: scripts/build_installer.ps1 -BuildDir build -Version ${{ steps.ver.outputs.version }} -NoBuild -CleanUi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keysynth-setup-${{ steps.ver.outputs.version }}
          path: |
            out/keysynth-setup.exe
            out/keysynth-setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "tag must be vX.Y.Z (got $GITHUB_REF_NAME)"; exit 1; }
            v="${BASH_REMATCH[1]}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            v="$INPUT_VERSION"
          else
            v="$(sed -nE 's/^project\(keysynth VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "keysynth $v"

      - name: Toolchain
        run: |
          brew install ninja
          clang --version
          cmake --version
          node --version

      - name: Cache dependency sources (.deps)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache Faust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/faust
          key: faust-${{ runner.os }}-${{ hashFiles('scripts/fetch_faust.sh') }}

      - name: Fetch Faust
        run: scripts/fetch_faust.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configure (sfizz ON, Faust ON)
        run: scripts/configure.sh build -DKS_VERSION=${{ steps.ver.outputs.version }} -DKS_WITH_SFIZZ=ON -DKS_WITH_FAUST=ON

      - name: Build (Release)
        run: cmake --build build --target keysynth-app ks-tests --parallel

      - name: Tests (default tier; hidden [.samples] / [.cloud-live] / [.full] are not run)
        run: build/bin/ks-tests --reporter compact

      - name: App + disk image
        run: scripts/build_app_macos.sh --build-dir build --version ${{ steps.ver.outputs.version }} --no-build --clean-ui

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keysynth-macos-${{ steps.ver.outputs.version }}
          path: |
            out/keysynth-macos.dmg
            out/keysynth-macos-${{ steps.ver.outputs.version }}.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [installer, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keysynth-setup-${{ needs.installer.outputs.version }}
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keysynth-macos-${{ needs.installer.outputs.version }}
          path: out
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/keysynth-setup.exe
            out/keysynth-setup-${{ needs.installer.outputs.version }}.exe
            out/keysynth-macos.dmg
            out/keysynth-macos-${{ needs.installer.outputs.version }}.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
